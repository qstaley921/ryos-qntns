<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Original drawing for QNTNs RyOS (CHECKLIST-37 §78): a beach-palm photo
       print with a silver point-and-shoot in front, in the spirit of an
       early-2000s Mac photo app icon. Drawn from scratch; nothing traced,
       downloaded or copied. Grid (base 4), padding as safari.svg: 128
       artboard, art inside 8..120 so 8px clear, shadow blur to ~4px of the
       edge. Print 88x72 at (20,16) turned -8deg round its centre (top corner
       lands at y10, so 8px clear holds); 4px white
       border. Camera 88x44 at (24,72), lens r16/r12/r8, flash 16x8,
       shutter 16x4. 1px hairlines are rules, exempt. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd8"/>
      <stop offset="1" stop-color="#bfe3fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8fb8"/>
      <stop offset="1" stop-color="#59c7d6"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="1" stop-color="#e2c27a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".45" stop-color="#c9d0d7"/>
      <stop offset=".55" stop-color="#a7b0ba"/>
      <stop offset="1" stop-color="#dfe4e9"/>
    </linearGradient>
    <radialGradient id="glass" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#7d9bc4"/>
      <stop offset=".5" stop-color="#22324a"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pic"><rect x="24" y="16" width="80" height="64"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- photo print -->
  <g transform="translate(0 4) rotate(-8 64 48)">
    <rect x="20" y="14" width="88" height="72" fill="#000" opacity=".3" filter="url(#shadow)"/>
    <rect x="20" y="12" width="88" height="72" fill="#fff" stroke="#9aa4af" stroke-width="1"/>
    <g clip-path="url(#pic)">
      <rect x="24" y="16" width="80" height="64" fill="url(#sky)"/>
      <circle cx="88" cy="28" r="8" fill="#fff6c8" opacity=".9"/>
      <rect x="24" y="52" width="80" height="12" fill="url(#sea)"/>
      <path d="M24 64 Q64 56 104 62 V80 H24Z" fill="url(#sand)"/>
      <!-- palm: curved trunk, five fronds -->
      <path d="M52 76 Q50 56 60 36" fill="none" stroke="#7a5228" stroke-width="4" stroke-linecap="round"/>
      <g fill="#2f8f2f" stroke="#1d5e1d" stroke-width="1">
        <path d="M60 36 Q44 28 32 40 Q46 32 60 38Z"/>
        <path d="M60 36 Q50 20 36 24 Q50 24 60 36Z"/>
        <path d="M60 36 Q64 20 76 20 Q66 24 61 36Z"/>
        <path d="M60 36 Q76 28 88 40 Q74 32 61 38Z"/>
        <path d="M60 36 Q68 44 68 56 Q64 44 59 38Z"/>
      </g>
    </g>
  </g>

  <!-- camera -->
  <rect x="24" y="74" width="88" height="44" rx="8" fill="#000" opacity=".35" filter="url(#shadow)"/>
  <rect x="80" y="68" width="16" height="4" rx="2" fill="#7c8691"/>
  <rect x="24" y="72" width="88" height="44" rx="8" fill="url(#metal)" stroke="#5f6873" stroke-width="1"/>
  <rect x="32" y="80" width="16" height="8" rx="2" fill="#eef4fa" stroke="#6d7d8f" stroke-width="1"/>
  <circle cx="76" cy="96" r="16" fill="#3b4652"/>
  <circle cx="76" cy="96" r="12" fill="url(#metal)" stroke="#2a323b" stroke-width="1"/>
  <circle cx="76" cy="96" r="8" fill="url(#glass)"/>
  <circle cx="72" cy="92" r="2" fill="#fff" opacity=".8"/>
  <rect x="28" y="74" width="80" height="16" rx="6" fill="url(#gloss)"/>
</svg>
