<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Original drawing for QNTNs RyOS (CHECKLIST-35 §47b): a compass in the
       spirit of an early-2000s Mac browser icon. Drawn from scratch; nothing
       traced, downloaded or copied. Grid (base 4): 128 artboard, dial r56 so
       8px clear on every side, shadow fills to 4px of the edge like the other
       128px dock icons (measured 2-5px). Rim r56, face r48, tick band r40-48,
       needle tip r36, half-width 8, hub r4. 1px hairlines are rules, exempt. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".45" stop-color="#b9c1ca"/>
      <stop offset=".55" stop-color="#9aa4af"/>
      <stop offset="1" stop-color="#e6eaee"/>
    </linearGradient>
    <radialGradient id="face" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#e2edf8"/>
      <stop offset="1" stop-color="#a9c3de"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <circle cx="64" cy="66" r="56" fill="#000" opacity=".35" filter="url(#shadow)"/>

  <circle cx="64" cy="64" r="56" fill="url(#metal)" stroke="#5f6873" stroke-width="1"/>
  <circle cx="64" cy="64" r="48" fill="url(#face)" stroke="#6d7d8f" stroke-width="1"/>

  <!-- ticks: 72 minor (r44-48), 8 major (r40-48), one major at north -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#3b4652" stroke-width="4"
          stroke-dasharray=".8 3.214" transform="rotate(-90.5 64 64)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#1f2933" stroke-width="8"
          stroke-dasharray="1.6 32.957" transform="rotate(-91 64 64)"/>

  <!-- needle, NE-SW: red half to the NE, white half to the SW; each half split
       light/dark for a bevel -->
  <g transform="rotate(45 64 64)" stroke-linejoin="round">
    <path d="M64 28 56 64h8z" fill="#ff5a4e"/>
    <path d="M64 28 72 64h-8z" fill="#c4161c"/>
    <path d="M64 100 56 64h8z" fill="#ffffff"/>
    <path d="M64 100 72 64h-8z" fill="#c9d0d8"/>
    <path d="M64 28 72 64 64 100 56 64z" fill="none" stroke="#3a1414" stroke-opacity=".55" stroke-width="1"/>
  </g>
  <circle cx="64" cy="64" r="4" fill="url(#metal)" stroke="#4a525c" stroke-width="1"/>

  <!-- glass highlight on the upper face -->
  <ellipse cx="64" cy="40" rx="36" ry="20" fill="url(#gloss)"/>
</svg>
